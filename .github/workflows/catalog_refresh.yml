name: Autonomous Catalog Refresh & Freshness Monitor

on:
  schedule:
    # Runs twice daily at 01:15 and 13:15 UTC (offset from keep-alive at 00:00 and 12:00)
    - cron: '15 1,13 * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Context retention window in days for confirmed ended/closed events'
        required: false
        default: '30'
      threshold_hours:
        description: 'Freshness evaluation threshold in hours'
        required: false
        default: '24'

# Prevent overlapping refresh runs
concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh & Audit Live Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
            python-version: '3.13'
            cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Trigger Live Refresh & Audit Freshness
        env:
          HACKPULSE_LIVE_URL: ${{ vars.HACKPULSE_LIVE_URL }}
          CATALOG_REFRESH_TOKEN: ${{ secrets.CATALOG_REFRESH_TOKEN }}
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '30' }}
          THRESHOLD_HOURS: ${{ github.event.inputs.threshold_hours || '24' }}
        run: |
          python scripts/run_catalog_refresh.py
